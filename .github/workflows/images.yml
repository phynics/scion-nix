name: Build Scion images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scion-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned upstream revision
        id: pin
        shell: bash
        run: |
          rev="$(jq -r '.rev' upstream.json)"
          tag="$(jq -r '.imageTag' upstream.json)"
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$tag" =~ ^[a-zA-Z0-9_.-]+$ ]] || exit 1
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: GoogleCloudPlatform/scion
          ref: ${{ steps.pin.outputs.rev }}
          path: upstream
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both Linux architectures
        working-directory: upstream
        env:
          IMAGE_TAG: ${{ steps.pin.outputs.tag }}
        run: |
          image-build/scripts/build-images.sh \
            --target all \
            --platform all \
            --registry ghcr.io/phynics \
            --tag "$IMAGE_TAG" \
            --push
      - name: Inspect published image manifests
        working-directory: upstream
        env:
          IMAGE_TAG: ${{ steps.pin.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(core-base scion-base scion-hub)
          for file in harnesses/*/Dockerfile; do
            images+=("scion-$(basename "$(dirname "$file")")")
          done
          for image in "${images[@]}"; do
            ref="ghcr.io/phynics/$image:$IMAGE_TAG"
            manifest="$(docker buildx imagetools inspect --raw "$ref")"
            for arch in amd64 arm64; do
              jq -e --arg arch "$arch" \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | length == 1' \
                <<< "$manifest" > /dev/null
              arch_digest="$(jq -r --arg arch "$arch" \
                '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
                <<< "$manifest")"
              jq -n --arg name "$image" --arg arch "$arch" --arg digest "$arch_digest" \
                '{name: $name, platform: ("linux/" + $arch), digest: $digest}' \
                >> "$RUNNER_TEMP/images.jsonl"
            done
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            echo "$ref  $digest" >> "$GITHUB_STEP_SUMMARY"
            docker buildx imagetools create \
              --tag "ghcr.io/phynics/$image:latest" \
              "$ref"
          done
          jq -s --arg rev '${{ steps.pin.outputs.rev }}' --arg tag "$IMAGE_TAG" \
            '{upstreamRev: $rev, tag: $tag, images: .}' \
            "$RUNNER_TEMP/images.jsonl" > "$RUNNER_TEMP/image-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: ${{ runner.temp }}/image-manifest.json
